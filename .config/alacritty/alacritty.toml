[font]
size = 11.0

[font.normal]
family = "Wired Mono"

[colors]
primary = { background = "#181819", foreground = "#c9c7c4" }

# base16-normal row (16 slots indexed 0–7)
[colors.normal]
black = "#181818"
red = "#ac4242"
green = "#90a959"
yellow = "#f4bf75"
blue = "#6a9fb5"
magenta = "#aa759f"
cyan = "#75b5aa"
white = "#c9c7c4"

# brights
[colors.bright]
black = "#6b6b6b"
red = "#c55555"
green = "#aac474"
yellow = "#feca88"
blue = "#82b8c8"
magenta = "#c28cb8"
cyan = "#93d3c3"
white = "#d8d8d8"

# dims (use true-color terminals which respect _bold dim effect)
[colors.dim]
black = "#0f0f0f"
red = "#712b2b"
green = "#5f6f3a"
yellow = "#a17e4d"
blue = "#456877"
magenta = "#704d68"
cyan = "#4d7770"
white = "#8e8e8e"

[[hints.enabled]]
regex = '([\w\.\/]{3,}):(\d+):'
command = { program = "vimat" }
mouse = { enabled = true, mods = "None" }
binding = { key = "Space", mods = "Control" }
#binding = { key = "DeadGrave", mods = "Control|Shift" } # tombstone key

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "ReceiveChar"  # or Ignored depending on zshell interp
