monitor.bluez.properties = {
    bluez5.codecs       = [ ldac, aac ]
    bluez5.default.rate = 48000
}

monitor.bluez.rules = [
    {
        matches = [
            { device.name = "~bluez_card.*" }
        ]
        actions = {
            update-props = {
                bluez5.a2dp.ldac.quality = "sq"
				bluez5.a2dp.aac.bitratemode = 5
            }
        }
    }
]
