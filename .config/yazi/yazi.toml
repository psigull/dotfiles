[mgr]
ratio = [1,3,2]

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
group = "git"

[opener]
engrampa = [
    { run = 'engrampa "$@"', orphan = true, desc = "Open with Engrampa" },
]

[open]
prepend_rules = [
    { mime = "application/zip", use = "engrampa" },
]
